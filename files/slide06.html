<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Slide 6 - 構成例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #0a0e1a;
    font-family: 'Noto Sans JP', sans-serif;
    color: #e8eaf0;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(0,200,120,0.06) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  }
  .accent-line {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #00c878, #00aaff);
  }
  .header {
    position: relative; z-index: 2;
    padding: 36px 80px 0;
  }
  .header-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: #00c878; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  h2 { font-size: 38px; font-weight: 900; letter-spacing: -0.5px; }
  h2 span { color: #00c878; }
  .sep { width: 40px; height: 3px; background: #00c878; border-radius: 2px; margin: 10px 0; }
  .main {
    position: relative; z-index: 2;
    padding: 20px 60px 0;
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 32px;
    align-items: start;
  }
  .arch-svg { width: 100%; }
  .combos { display: flex; flex-direction: column; gap: 14px; }
  .combo {
    border-radius: 10px; padding: 16px 18px;
    border: 1px solid;
  }
  .combo.rec {
    background: rgba(0,200,120,0.06);
    border-color: rgba(0,200,120,0.3);
  }
  .combo.leg {
    background: rgba(255,200,50,0.05);
    border-color: rgba(255,200,50,0.2);
  }
  .combo.ng {
    background: rgba(255,80,80,0.05);
    border-color: rgba(255,80,80,0.15);
    opacity: 0.7;
  }
  .combo-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .rec .combo-label { color: #00c878; }
  .leg .combo-label { color: #ffc832; }
  .ng .combo-label { color: #ff5050; }
  .combo-stack {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 700; margin-bottom: 6px;
  }
  .rec .combo-stack { color: #00c878; }
  .leg .combo-stack { color: #ffc832; }
  .ng .combo-stack { color: #ff5050; }
  .combo-arr { color: #3a4455; font-weight: 400; }
  .combo-desc { font-size: 12px; color: #6a7484; line-height: 1.5; }
  .note {
    font-size: 11px; color: #3a4455;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
  }
  .slide-num {
    position: absolute; bottom: 28px; right: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: #3a4455; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="accent-line"></div>
<div class="header">
  <div class="header-tag">// architecture</div>
  <h2>実際の<span>構成パターン</span></h2>
  <div class="sep"></div>
</div>
<div class="main">
  <!-- Architecture diagram -->
  <svg class="arch-svg" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Internet layer -->
    <rect x="20" y="20" width="640" height="60" rx="8" fill="rgba(0,170,255,0.06)" stroke="rgba(0,170,255,0.2)" stroke-width="1"/>
    <text x="340" y="46" text-anchor="middle" fill="rgba(0,170,255,0.6)" font-family="JetBrains Mono" font-size="10" font-weight="700">INTERNET / PLAYERS</text>
    <text x="340" y="64" text-anchor="middle" fill="rgba(0,170,255,0.4)" font-family="JetBrains Mono" font-size="9">複数のクライアントが接続</text>

    <!-- Arrow down -->
    <line x1="340" y1="80" x2="340" y2="118" stroke="rgba(0,200,120,0.5)" stroke-width="2"/>
    <polygon points="340,120 334,108 346,108" fill="rgba(0,200,120,0.6)"/>

    <!-- Proxy layer -->
    <rect x="180" y="120" width="320" height="70" rx="8" fill="rgba(0,200,120,0.1)" stroke="#00c878" stroke-width="2"/>
    <text x="340" y="150" text-anchor="middle" fill="#00c878" font-family="JetBrains Mono" font-size="13" font-weight="700">PROXY LAYER</text>
    <text x="290" y="170" text-anchor="middle" fill="rgba(0,200,120,0.8)" font-family="JetBrains Mono" font-size="10">⚡ Velocity</text>
    <text x="390" y="170" text-anchor="middle" fill="rgba(255,200,50,0.6)" font-family="JetBrains Mono" font-size="10">🔗 BungeeCord</text>
    <text x="340" y="184" text-anchor="middle" fill="rgba(0,200,120,0.4)" font-family="JetBrains Mono" font-size="9">Port :25565 （外部公開）</text>

    <!-- Arrows to game servers -->
    <line x1="230" y1="190" x2="110" y2="268" stroke="rgba(0,200,120,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="310" y1="190" x2="270" y2="268" stroke="rgba(0,200,120,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="370" y1="190" x2="410" y2="268" stroke="rgba(0,200,120,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="450" y1="190" x2="570" y2="268" stroke="rgba(0,200,120,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>

    <!-- Game servers -->
    <g transform="translate(80,270)">
      <rect x="-55" y="0" width="110" height="72" rx="8" fill="rgba(255,120,50,0.1)" stroke="rgba(255,120,50,0.4)" stroke-width="1.5"/>
      <text x="0" y="22" text-anchor="middle" fill="#ff7832" font-family="JetBrains Mono" font-size="11" font-weight="700">📄 Paper</text>
      <text x="0" y="40" text-anchor="middle" fill="rgba(255,120,50,0.7)" font-family="JetBrains Mono" font-size="9">ロビー</text>
      <text x="0" y="58" text-anchor="middle" fill="rgba(255,120,50,0.5)" font-family="JetBrains Mono" font-size="8">:25566 （内部）</text>
    </g>
    <g transform="translate(270,270)">
      <rect x="-55" y="0" width="110" height="72" rx="8" fill="rgba(255,120,50,0.1)" stroke="rgba(255,120,50,0.4)" stroke-width="1.5"/>
      <text x="0" y="22" text-anchor="middle" fill="#ff7832" font-family="JetBrains Mono" font-size="11" font-weight="700">📄 Paper</text>
      <text x="0" y="40" text-anchor="middle" fill="rgba(255,120,50,0.7)" font-family="JetBrains Mono" font-size="9">サバイバル</text>
      <text x="0" y="58" text-anchor="middle" fill="rgba(255,120,50,0.5)" font-family="JetBrains Mono" font-size="8">:25567 （内部）</text>
    </g>
    <g transform="translate(410,270)">
      <rect x="-55" y="0" width="110" height="72" rx="8" fill="rgba(180,100,255,0.1)" stroke="rgba(180,100,255,0.4)" stroke-width="1.5"/>
      <text x="0" y="22" text-anchor="middle" fill="#b464ff" font-family="JetBrains Mono" font-size="11" font-weight="700">🔧 Spigot</text>
      <text x="0" y="40" text-anchor="middle" fill="rgba(180,100,255,0.7)" font-family="JetBrains Mono" font-size="9">ミニゲーム</text>
      <text x="0" y="58" text-anchor="middle" fill="rgba(180,100,255,0.5)" font-family="JetBrains Mono" font-size="8">:25568 （内部）</text>
    </g>
    <g transform="translate(570,270)">
      <rect x="-55" y="0" width="110" height="72" rx="8" fill="rgba(255,120,50,0.1)" stroke="rgba(255,120,50,0.4)" stroke-width="1.5"/>
      <text x="0" y="22" text-anchor="middle" fill="#ff7832" font-family="JetBrains Mono" font-size="11" font-weight="700">📄 Paper</text>
      <text x="0" y="40" text-anchor="middle" fill="rgba(255,120,50,0.7)" font-family="JetBrains Mono" font-size="9">クリエイティブ</text>
      <text x="0" y="58" text-anchor="middle" fill="rgba(255,120,50,0.5)" font-family="JetBrains Mono" font-size="8">:25569 （内部）</text>
    </g>

    <!-- Firewall note -->
    <rect x="20" y="240" width="640" height="12" rx="0" fill="rgba(255,80,80,0.04)" stroke="rgba(255,80,80,0.15)" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="340" y="250" text-anchor="middle" fill="rgba(255,80,80,0.5)" font-family="JetBrains Mono" font-size="8">🔒 FIREWALL: ゲームサーバーポートは外部から遮断</text>

    <!-- Labels -->
    <text x="340" y="420" text-anchor="middle" fill="rgba(255,255,255,0.1)" font-family="JetBrains Mono" font-size="9">各ゲームサーバーは localhost / プライベートネットワーク内で動作</text>
  </svg>

  <!-- Combo patterns -->
  <div class="combos">
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#3a4455;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">推奨組み合わせ</div>
    <div class="combo rec">
      <div class="combo-label">✅ 最推奨</div>
      <div class="combo-stack">
        Velocity <span class="combo-arr">+</span> Paper
      </div>
      <div class="combo-desc">パフォーマンス・セキュリティともに最高水準。新規構築はこれ一択。</div>
    </div>
    <div class="combo leg">
      <div class="combo-label">⚠️ レガシー構成</div>
      <div class="combo-stack">
        BungeeCord <span class="combo-arr">+</span> Spigot
      </div>
      <div class="combo-desc">古くからある構成。既存サーバーの維持に。新規では非推奨。</div>
    </div>
    <div class="combo leg">
      <div class="combo-label">🟡 混在構成</div>
      <div class="combo-stack">
        Velocity <span class="combo-arr">+</span> Spigot
      </div>
      <div class="combo-desc">可能だが Spigot 側の設定が必要。できれば Paper への移行を。</div>
    </div>
    <div class="combo ng">
      <div class="combo-label">❌ 非推奨</div>
      <div class="combo-stack">
        BungeeCord <span class="combo-arr">+</span> Paper
      </div>
      <div class="combo-desc">機能的には動くが、Velocity の恩恵を受けられず非効率。</div>
    </div>
  </div>
</div>
<div class="slide-num">06 / 08</div>
</body>
</html>
