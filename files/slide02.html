<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Slide 2 - プロキシとは</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #0a0e1a;
    font-family: 'Noto Sans JP', sans-serif;
    color: #e8eaf0;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 5% 50%, rgba(0,200,120,0.05) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  }
  .accent-line {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #00c878, #00aaff);
  }
  .header {
    position: relative; z-index: 2;
    padding: 44px 80px 0;
    display: flex; align-items: center; gap: 16px;
  }
  .header-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: #00c878; letter-spacing: 3px;
    text-transform: uppercase;
  }
  h2 {
    font-size: 40px; font-weight: 900; letter-spacing: -0.5px;
  }
  h2 span { color: #00c878; }
  .body {
    position: relative; z-index: 2;
    padding: 36px 80px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .left { display: flex; flex-direction: column; gap: 18px; }
  .desc {
    font-size: 17px; color: #8892a4; font-weight: 300; line-height: 1.7;
    border-left: 3px solid rgba(0,200,120,0.5);
    padding-left: 16px;
  }
  .point {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; padding: 16px 20px;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .point-icon {
    font-size: 22px; flex-shrink: 0; margin-top: 2px;
  }
  .point-title { font-size: 14px; font-weight: 700; color: #00c878; margin-bottom: 4px; }
  .point-text { font-size: 13px; color: #7a8494; line-height: 1.6; }
  .right {
    display: flex; justify-content: center; align-items: center;
  }
  .diagram { width: 100%; }
  .slide-num {
    position: absolute; bottom: 28px; right: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: #3a4455; letter-spacing: 2px;
  }
  .sep { width: 40px; height: 3px; background: #00c878; border-radius: 2px; margin: 4px 0 16px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="accent-line"></div>
<div class="header">
  <div>
    <div class="header-tag">// concept</div>
    <h2>プロキシサーバーとは<span>？</span></h2>
    <div class="sep"></div>
  </div>
</div>
<div class="body">
  <div class="left">
    <p class="desc">複数のゲームサーバーの前段に置かれる「中継役」。プレイヤーはプロキシに接続し、そこから各ゲームサーバーへ振り分けられる。</p>
    <div class="point">
      <div class="point-icon">🌐</div>
      <div>
        <div class="point-title">単一IPで複数サーバー管理</div>
        <div class="point-text">1つのポート (25565) でロビー・生存・ミニゲームなど複数のワールドを束ねられる</div>
      </div>
    </div>
    <div class="point">
      <div class="point-icon">⚡</div>
      <div>
        <div class="point-title">シームレスな移動</div>
        <div class="point-text">プレイヤーが再接続なしに別のサーバーへ移動できる (/server コマンドなど)</div>
      </div>
    </div>
    <div class="point">
      <div class="point-icon">🔒</div>
      <div>
        <div class="point-title">集中管理・セキュリティ</div>
        <div class="point-text">Ban・認証・チャットなどの処理をプロキシ層で一元管理できる</div>
      </div>
    </div>
  </div>
  <div class="right">
    <svg class="diagram" viewBox="0 0 460 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Players -->
      <g transform="translate(50,60)">
        <circle cx="0" cy="0" r="24" fill="rgba(0,170,255,0.12)" stroke="rgba(0,170,255,0.5)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#00aaff" font-family="JetBrains Mono" font-size="9" font-weight="700">P1</text>
      </g>
      <g transform="translate(50,200)">
        <circle cx="0" cy="0" r="24" fill="rgba(0,170,255,0.12)" stroke="rgba(0,170,255,0.5)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#00aaff" font-family="JetBrains Mono" font-size="9" font-weight="700">P2</text>
      </g>
      <g transform="translate(50,340)">
        <circle cx="0" cy="0" r="24" fill="rgba(0,170,255,0.12)" stroke="rgba(0,170,255,0.5)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#00aaff" font-family="JetBrains Mono" font-size="9" font-weight="700">P3</text>
      </g>
      <!-- Arrow to proxy -->
      <line x1="74" y1="60" x2="170" y2="160" stroke="rgba(0,170,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <line x1="74" y1="200" x2="170" y2="190" stroke="rgba(0,170,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <line x1="74" y1="340" x2="170" y2="220" stroke="rgba(0,170,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <!-- Proxy box -->
      <rect x="170" y="140" width="120" height="80" rx="8" fill="rgba(0,200,120,0.12)" stroke="#00c878" stroke-width="2"/>
      <text x="230" y="176" text-anchor="middle" fill="#00c878" font-family="JetBrains Mono" font-size="11" font-weight="700">PROXY</text>
      <text x="230" y="194" text-anchor="middle" fill="rgba(0,200,120,0.7)" font-family="JetBrains Mono" font-size="9">:25565</text>
      <!-- Arrows to servers -->
      <line x1="290" y1="165" x2="360" y2="80" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <line x1="290" y1="180" x2="360" y2="200" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <line x1="290" y1="195" x2="360" y2="320" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <!-- Servers -->
      <g transform="translate(360,80)">
        <rect x="-38" y="-18" width="76" height="36" rx="5" fill="rgba(255,165,0,0.12)" stroke="rgba(255,165,0,0.6)" stroke-width="1.5"/>
        <text x="0" y="-3" text-anchor="middle" fill="#ffa500" font-family="JetBrains Mono" font-size="9" font-weight="700">ロビー</text>
        <text x="0" y="12" text-anchor="middle" fill="rgba(255,165,0,0.6)" font-family="JetBrains Mono" font-size="8">:25566</text>
      </g>
      <g transform="translate(360,200)">
        <rect x="-38" y="-18" width="76" height="36" rx="5" fill="rgba(255,80,80,0.12)" stroke="rgba(255,80,80,0.6)" stroke-width="1.5"/>
        <text x="0" y="-3" text-anchor="middle" fill="#ff5050" font-family="JetBrains Mono" font-size="9" font-weight="700">生存鯖</text>
        <text x="0" y="12" text-anchor="middle" fill="rgba(255,80,80,0.6)" font-family="JetBrains Mono" font-size="8">:25567</text>
      </g>
      <g transform="translate(360,320)">
        <rect x="-38" y="-18" width="76" height="36" rx="5" fill="rgba(100,150,255,0.12)" stroke="rgba(100,150,255,0.6)" stroke-width="1.5"/>
        <text x="0" y="-3" text-anchor="middle" fill="#6496ff" font-family="JetBrains Mono" font-size="9" font-weight="700">ミニゲーム</text>
        <text x="0" y="12" text-anchor="middle" fill="rgba(100,150,255,0.6)" font-family="JetBrains Mono" font-size="8">:25568</text>
      </g>
      <!-- Arrow heads -->
      <polygon points="170,160 155,148 165,173" fill="rgba(0,170,255,0.5)"/>
      <polygon points="170,190 153,185 166,205" fill="rgba(0,170,255,0.5)"/>
      <polygon points="170,220 155,228 163,205" fill="rgba(0,170,255,0.5)"/>
    </svg>
  </div>
</div>
<div class="slide-num">02 / 08</div>
</body>
</html>
