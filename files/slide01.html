<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Slide 1 - タイトル</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #0a0e1a;
    font-family: 'Noto Sans JP', sans-serif;
    color: #e8eaf0;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 50%, rgba(0,200,120,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 10% 80%, rgba(0,100,255,0.07) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
  }
  .accent-line {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #00c878, #00aaff, #00c878);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
  .content {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 60px 100px;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: #00c878; letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid rgba(0,200,120,0.4);
    padding: 6px 14px; border-radius: 3px;
    margin-bottom: 40px;
    animation: fadeIn 0.6s ease both;
  }
  h1 {
    font-size: 64px; font-weight: 900; line-height: 1.1;
    letter-spacing: -1px;
    animation: fadeUp 0.7s 0.1s ease both;
  }
  h1 span { color: #00c878; }
  .subtitle {
    font-size: 22px; color: #8892a4; font-weight: 300;
    margin-top: 20px; max-width: 650px; line-height: 1.6;
    animation: fadeUp 0.7s 0.2s ease both;
  }
  .stack-badges {
    display: flex; gap: 12px; margin-top: 48px;
    animation: fadeUp 0.7s 0.35s ease both;
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; padding: 8px 18px;
    border-radius: 4px; font-weight: 700;
    letter-spacing: 1px;
  }
  .badge.proxy { background: rgba(0,200,120,0.15); border: 1px solid rgba(0,200,120,0.5); color: #00c878; }
  .badge.paper { background: rgba(255,165,0,0.15); border: 1px solid rgba(255,165,0,0.5); color: #ffa500; }
  .badge.spigot { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.5); color: #ff5050; }
  .deco {
    position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
    width: 380px; height: 380px; z-index: 1;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(-50%) translateX(0)} 50%{transform:translateY(-52%) translateX(-8px)} }
  .slide-num {
    position: absolute; bottom: 28px; right: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: #3a4455; letter-spacing: 2px;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="bg"></div>
<div class="accent-line"></div>

<svg class="deco" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
  <!-- Network diagram decoration -->
  <circle cx="190" cy="190" r="100" fill="none" stroke="rgba(0,200,120,0.15)" stroke-width="1"/>
  <circle cx="190" cy="190" r="150" fill="none" stroke="rgba(0,170,255,0.1)" stroke-width="1"/>
  <circle cx="190" cy="190" r="50" fill="rgba(0,200,120,0.08)" stroke="rgba(0,200,120,0.4)" stroke-width="1.5"/>
  <text x="190" y="196" text-anchor="middle" fill="#00c878" font-family="JetBrains Mono" font-size="10" font-weight="700">PROXY</text>
  <!-- Server nodes -->
  <g transform="translate(190,90)">
    <rect x="-28" y="-14" width="56" height="28" rx="4" fill="rgba(255,165,0,0.15)" stroke="rgba(255,165,0,0.6)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffa500" font-family="JetBrains Mono" font-size="9" font-weight="700">Paper</text>
  </g>
  <g transform="translate(290,240)">
    <rect x="-28" y="-14" width="56" height="28" rx="4" fill="rgba(255,80,80,0.15)" stroke="rgba(255,80,80,0.6)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#ff5050" font-family="JetBrains Mono" font-size="9" font-weight="700">Spigot</text>
  </g>
  <g transform="translate(90,240)">
    <rect x="-28" y="-14" width="56" height="28" rx="4" fill="rgba(100,150,255,0.15)" stroke="rgba(100,150,255,0.6)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#6496ff" font-family="JetBrains Mono" font-size="9" font-weight="700">Vanilla</text>
  </g>
  <!-- Lines -->
  <line x1="190" y1="140" x2="190" y2="104" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="222" y1="215" x2="270" y2="240" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="158" y1="215" x2="110" y2="240" stroke="rgba(0,200,120,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Client -->
  <g transform="translate(190,340)">
    <circle cx="0" cy="0" r="22" fill="rgba(0,170,255,0.12)" stroke="rgba(0,170,255,0.5)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#00aaff" font-family="JetBrains Mono" font-size="9" font-weight="700">Client</text>
  </g>
  <line x1="190" y1="240" x2="190" y2="318" stroke="rgba(0,170,255,0.5)" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- dots -->
  <circle cx="190" cy="90" r="3" fill="#00c878"/>
  <circle cx="290" cy="240" r="3" fill="#00c878"/>
  <circle cx="90" cy="240" r="3" fill="#00c878"/>
</svg>

<div class="content">
  <div class="tag">Minecraft Server Infrastructure</div>
  <h1>マイクラサーバーの<br><span>プロキシ</span>完全ガイド</h1>
  <p class="subtitle">Velocity・BungeeCord・Paper・Spigot の違いと使い分けを徹底解説</p>
  <div class="stack-badges">
    <span class="badge proxy">Velocity</span>
    <span class="badge proxy">BungeeCord</span>
    <span class="badge paper">Paper</span>
    <span class="badge spigot">Spigot</span>
  </div>
</div>

<div class="slide-num">01 / 08</div>
</body>
</html>
